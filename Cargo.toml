[package]
name = "simplex-trace"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Exact-arithmetic simplex (primal, Big-M, two-phase, dual) that records every tableau and pivot as data, with sensitivity analysis."
license = "MIT OR Apache-2.0"
repository = "https://github.com/angelariasus/simplex-trace"
keywords = ["simplex", "linear-programming", "optimization", "education", "exact"]
categories = ["mathematics", "science", "algorithms"]
exclude = [".github"]

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
## Serialize and deserialize problems, solutions and traces (rationals as exact strings like "3/2").
serde = ["dep:serde"]
## Convert `Rational` to and from `num_rational::BigRational` (ties you to its version).
num-interop = []

[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "json"
required-features = ["serde"]

# Exact big-integer arithmetic is very slow unoptimized; the oracle test runs ~8x faster.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
